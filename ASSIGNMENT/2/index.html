<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Feedback Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Product Feedback</h1>
        <p>We would like to know your experience with our product.</p>
    </header>


    <main>

        <form id="feedbackForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <small id="nameError"></small>
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="Enter your email">
                <small id="emailError"></small>
            </div>


            <div class="form-group">
                <label for="product">Product Name</label>
                <input type="text" id="product" placeholder="Enter product name">
                <small id="productError"></small>
            </div>


            <div class="form-group">
                <label for="rating">Product Rating</label>

                <select id="rating">
                    <option value="">Select Rating</option>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Very Good</option>
                    <option value="3">3 - Good</option>
                    <option value="2">2 - Poor</option>
                    <option value="1">1 - Very Poor</option>
                </select>

                <small id="ratingError"></small>
            </div>


            <div class="form-group">
                <label for="feedback">Your Feedback</label>

                <textarea
                    id="feedback"
                    placeholder="Write your feedback here..."
                ></textarea>

                <small id="feedbackError"></small>
            </div>


            <button type="submit">
                Submit Feedback
            </button>

            <p id="successMessage"></p>

        </form>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
