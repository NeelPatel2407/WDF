<body>

    <h2>CHARUSAT Student Hub</h2>

    <a href="dashboard.html">Dashboard</a> |
    <a href="profile.html">Profile</a> |

    <hr>

    <h1 align="center">Faculty Feedback</h1>

    <table border="1" align="center" cellpadding="10">

        <tr>
            <td>Select Faculty</td>
            <td>
                <select>
                    <option>Dr. Amit Nayak</option>
                    <option>Mr. Jay Patel</option>
                    <option>Mr. Rajesh Patel</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Teaching Style</td>
            <td>
                <input type="radio" name="t"> Excellent
                <input type="radio" name="t"> Good
                <input type="radio" name="t"> Average
            </td>
        </tr>

        <tr>
            <td>Student Interaction</td>
            <td>
                <input type="radio" name="s"> Excellent
                <input type="radio" name="s"> Good
                <input type="radio" name="s"> Average
            </td>
        </tr>

        <tr>
            <td>Subject Knowledge</td>
            <td>
                <input type="radio" name="k"> Excellent
                <input type="radio" name="k"> Good
                <input type="radio" name="k"> Average
            </td>
        </tr>

        <tr>
            <td>Suggestions</td>
            <td>
                <textarea rows="4" cols="30"></textarea>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <button>Submit</button>
                <button>Reset</button>
            </td>
        </tr>

    </table>

    <br>
