<!DOCTYPE html>
<html>

<head>
    <title>Profile Page</title>
</head>

<body>

    <h2>CHARUSAT Student Hub</h2>

    <a href="dashboard.html">Dashboard</a> |
    <a href="course_registration.html">Courses</a> |
    <a href="event_calendar.html">Events</a>

    <hr>

    <h1 align="center">Student Profile</h1>

    <table border="1" align="center" cellpadding="15">

        <tr>

            <td rowspan="5" align="center">
                <img src="student.jpg" alt="Student Photo" width="150" height="180">
                <br><br>
                <button>Upload Photo</button>
            </td>

            <td>First Name:</td>
            <td><input type="text"></td>

        </tr>

        <tr>
            <td>Middle Name:</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Last Name:</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Birth Date:</td>
            <td><input type="date"></td>
        </tr>

        <tr>
            <td>Gender:</td>
            <td>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </td>
        </tr>

        <tr>
            <td>Father's Name:</td>
            <td colspan="2"><input type="text"></td>
        </tr>

        <tr>
            <td>Mother's Name:</td>
            <td colspan="2"><input type="text"></td>
        </tr>

        <tr>
            <td>Contact No.:</td>
            <td colspan="2"><input type="text"></td>
        </tr>

        <tr>
            <td>Email:</td>
            <td colspan="2"><input type="email"></td>
        </tr>

        <tr>
            <td>Program:</td>
            <td colspan="2">
                <select>
                    <option>B.Tech CSE</option>
                    <option>B.Tech IT</option>
                    <option>B.Tech CE</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Semester:</td>
            <td colspan="2">
                <select>
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                    <option>Semester 7</option>
                    <option>Semester 8</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Address:</td>
            <td colspan="2">
                <textarea rows="3" cols="40"></textarea>
            </td>
        </tr>

        <tr>
            <td>Hobby:</td>
            <td colspan="2"><input type="text"></td>
        </tr>

        <tr>
            <td colspan="3" align="center">
                <button>Save</button>
                <button>Reset</button>
            </td>
        </tr>

    </table>

    <hr>

    <center>
        <p>© 2026 Charotar University of Science & Technology. All Rights Reserved</p>
    </center>

</body>

</html>
