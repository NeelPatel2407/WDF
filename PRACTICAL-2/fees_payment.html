<!DOCTYPE html>
<html>

<head>
    <title>Fees Payment</title>
    <link rel="stylesheet" href="../PRACTICAL-3/fees_payment.css">
</head>

<body>

    <div class="topbar">

        <h2>CampusCore</h2>

        <a href="dashboard.html">Dashboard</a> |
        <a href="profile.html">Profile</a> |
        <a href="course_registration.html">Courses</a>

    </div>

    <hr>

    <h1>Fees Payment Portal</h1>

    <table class="fees-table">

        <tr>
            <td>Student Name</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Student ID</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Institute</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Branch</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Semester</td>
            <td>
                <select>
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                    <option>Semester 7</option>
                    <option>Semester 8</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Fees Amount</td>
            <td><input type="text" value="77500"></td>
        </tr>

        <tr>
            <td>Payment Method</td>
            <td>
                <input type="radio" name="pay"> UPI
                <input type="radio" name="pay"> Card
                <input type="radio" name="pay"> Net Banking
            </td>
        </tr>

        <tr>
            <td>UPI ID / Account No.</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>IFSC Code</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Captcha</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td colspan="2" class="buttons">
                <button>Pay Now</button>
                <button type="reset">Reset</button>
            </td>
        </tr>

    </table>

    <hr>

    <p class="footer">
        © 2026 Charotar University of Science & Technology. All Rights Reserved
    </p>

</body>

</html>
