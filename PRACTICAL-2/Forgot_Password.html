<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../PRACTICAL-3/forgot_password.css">
</head>

<body>

    <table class="forgot-table">

        <tr>

            <td class="features">

                <h1>Student Hub</h1>

                <hr>

                <ul>
                    <li>Lecture Attendance</li>
                    <li>Lecture Time Table</li>
                    <li>University Result</li>
                    <li>E-Governance</li>
                    <li>Fees Payment</li>
                    <li>Course Registration</li>
                    <li>Event Calendar</li>
                </ul>

            </td>

            <td class="forgot-box">

                <h2>Forgot Password</h2>

                <hr>

                <br>

                <label>Student ID</label>
                <br>
                <input type="text" placeholder="Enter Student ID">

                <br><br>

                <label>Email Address</label>
                <br>
                <input type="email" placeholder="Enter Email">

                <br><br>

                <label>Mobile Number</label>
                <br>
                <input type="text" placeholder="Enter Mobile Number">

                <br><br>

                <label>New Password</label>
                <br>
                <input type="password" placeholder="New Password">

                <br><br>

                <label>Confirm Password</label>
                <br>
                <input type="password" placeholder="Confirm Password">

                <br><br>

                <button>Reset Password</button>
                <button>Cancel</button>

                <br><br>

                <a href="login.html">Back to Login</a>

            </td>

        </tr>

    </table>

    <hr>

    <p class="footer">
        © 2026 Charotar University of Science & Technology. All Rights Reserved
    </p>

</body>

</html>
