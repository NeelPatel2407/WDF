<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - CampusCore</title>
   <link rel="stylesheet" href="../PRACTICAL-3/register.css">
</head>

<body>

<div class="container">

    <header>
        <h1>CampusCore</h1>
        <p>CHARUSAT Student Registration</p>
    </header>

    <main>

        <h2>Create Student Account</h2>

        <nav>
            <a href="../PRACTICAL-2/Home.html">Home</a>
            <a href="../PRACTICAL-2/login.html">Login</a>
            <a href="../PRACTICAL-2/Contactsupport&FAQ.html">Help & FAQ</a>
        </nav>

        <br>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="Enter first name">
                <span class="error" id="firstNameError"></span>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Enter last name">
                <span class="error" id="lastNameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" maxlength="10" placeholder="Enter 10-digit mobile number">
                <span class="error" id="mobileError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" placeholder="Enter password">

                <div class="strength-box">
                    <div id="strengthBar"></div>
                </div>

                <span id="strengthText"></span>
                <span class="error" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <div class="form-group">
                <label for="course">Course</label>

                <select id="course">
                    <option value="">Select Course</option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="B.Tech IT">B.Tech IT</option>
                    <option value="B.Tech CE">B.Tech CE</option>
                </select>

                <span class="error" id="courseError"></span>
            </div>

            <div class="form-group">
                <label for="year">Year</label>

                <select id="year">
                    <option value="">Select Year</option>
                    <option value="First Year">First Year</option>
                    <option value="Second Year">Second Year</option>
                    <option value="Third Year">Third Year</option>
                    <option value="Fourth Year">Fourth Year</option>
                </select>

                <span class="error" id="yearError"></span>
            </div>

            <fieldset>

                <legend>Gender</legend>

                <label class="radio-label">
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label class="radio-label">
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label class="radio-label">
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>

                <span class="error" id="genderError"></span>

            </fieldset>

            <div class="terms">

                <label>
                    <input type="checkbox" id="terms">
                    I accept the Terms and Conditions
                </label>

                <span class="error" id="termsError"></span>

            </div>

            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset">Reset</button>
            </div>

            <p id="successMessage"></p>

        </form>

    </main>

    <footer>
        © 2026 Charotar University of Science & Technology. All Rights Reserved
    </footer>

</div>

<script src="registration.js"></script>

</body>
</html>
